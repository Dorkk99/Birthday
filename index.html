<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy 19th Birthday, Lakmi 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="world"></div>
<div id="bokeh"></div>
<div id="rays"></div>
<div id="veil"></div>

<div id="lilies">
  <img class="ly L" src="assets/art/lily1.png" alt=""><img class="ly Rr" src="assets/art/lily2.png" alt="">
</div>

<div id="stage">
  <div id="cakebox">
    <div id="glow"></div>
    <img id="lit" src="assets/art/cake.png" alt="Cake with lit candles">
    <img id="out" src="assets/art/cake-out.png" alt="Cake, candles blown out">
  </div>
  <div id="lyr"></div>
  <p id="ask"></p>
  <button id="go" class="btn">🎶 Tap to begin</button>
  <button id="blow" class="btn" hidden>💨 Blow the candles</button>
</div>

<div id="border"></div>

<div id="note">
  <div class="paper">
    <img class="seal" src="assets/stickers/heart1.png" alt="">
    <div id="msg"></div>
    <div class="acts" hidden><button id="again" class="btn">🎉 Celebrate again</button><button id="replay" class="btn">🔁 Replay</button></div>
  </div>
</div>

<div id="lb"><button id="prev">‹</button><img alt=""><button id="next">›</button></div>
<div id="toast"></div>
<button id="snd" hidden aria-label="Toggle music">🔊</button>
<canvas id="fx"></canvas>
<script src="script.js"></script>
</body>
</html>
